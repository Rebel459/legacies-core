plugins {
	id 'net.fabricmc.fabric-loom' version '1.16-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://api.modrinth.com/maven"}
	maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.frozenblock.net/release" }
	maven { url = "https://maven.bawnorton.com/releases" }
	flatDir {
		dirs 'lib'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.api_version}"

	implementation("maven.modrinth:unified-api:$unified_version-fabric")
	implementation("maven.modrinth:lithostitched:$lithostitched_version")

	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

	implementation("maven.modrinth:fancymenu:$fancymenu_version")
	implementation("maven.modrinth:the-copperier-age:$tca_version")
	implementation("maven.modrinth:wilder-wild:$wilder_version")

	implementation("maven.modrinth:notes:$notes_version")
	implementation("maven.modrinth:jei:$jei_version")
	implementation("maven.modrinth:77x98dqG:QukT8MIn") // Bits and Balance

	api("maven.modrinth:frozenlib:$frozenlib_version")
	implementation("maven.modrinth:biolith:$biolith_version")
	api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	include implementation("net.rebel459.legacies:bundled-1.4.0-26.1.2")
	include implementation("net.rebel459.legacies:carbasa-1.6-multi")
	include implementation("net.rebel459.legacies:elytra-revamped-rerewritten+26.2-1.0.3")
	include implementation("net.rebel459.legacies:enchanteds_sodium_options-1.3.1+0.9.1-mc26.1.2-fabric")
	include implementation("net.rebel459.legacies:fps-sync-1.0.0+26.1")
	include implementation("net.rebel459.legacies:harous-leashed-fences-1.1.0+26.1.X")
	include implementation("net.rebel459.legacies:locator_lodestones-1.5.3+26.1+A")
	include implementation("net.rebel459.legacies:shifting-wares-4.0.0+26.1.2")
	include implementation("net.rebel459.legacies:simple-registry-aliases-1.1.0+26.1")
	include implementation("net.rebel459.legacies:Tooltipz-1.4.1-1.21.9")
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 25
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_25
	targetCompatibility = JavaVersion.VERSION_25
}

jar {
	from("LICENSE") {
		rename { "${it}_${project.base.archivesName.get()}"}
	}
}

// Datagen

fabricApi {
	configureDataGeneration()
}

loom {
    accessWidenerPath = file("src/main/resources/legacies.classtweaker")

	mods {
		"legacies" {
			sourceSet sourceSets.main
		}
	}

	runs {
		datagen {
			inherit client
		}
	}
}