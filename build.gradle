plugins {
	id 'net.fabricmc.fabric-loom' version '1.15-SNAPSHOT'
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
	archivesName = project.archives_base_name
}

repositories {
	maven { url = "https://api.modrinth.com/maven"}
	maven { url = "https://maven.shedaniel.me/" }
    maven { url = "https://maven.frozenblock.net/release" }
	maven { url = "https://maven.bawnorton.com/releases" }
	flatDir {
		dirs 'lib'
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"

	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    api("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
        exclude(group: "net.fabricmc.fabric-api")
    }
	api("maven.modrinth:frozenlib:$frozenlib_version")
	include(implementation(annotationProcessor("com.github.bawnorton.mixinsquared:mixinsquared-fabric:0.3.7-beta.1")))

	implementation("maven.modrinth:the-copperier-age:$tca_version")
	include implementation("net.legacy.legacies:enderscape-fabric-2.1.1+mc26.1.2")

/*	include implementation("net.legacy.legacies:armor-stand-overhaul-0.1")
    include implementation("net.legacy.legacies:bundled-1.4.0-1.21.5")
    include implementation("net.legacy.legacies:carbasa-1.5-multi")
    include implementation("net.legacy.legacies:doors-closed-1.0.0+1.19.4")
    include implementation("net.legacy.legacies:elytra-revamped-rerewritten+1.21.11-1.0.1")
    include implementation("net.legacy.legacies:enchanteds_sodium_options-1.1.4+0.8.7-mc1.21.11-fabric")
    include implementation("net.legacy.legacies:fps-sync-1.0.0+1.21.11")
    include implementation("net.legacy.legacies:harous-leashed-fences-1.0.1+1.21.11")
    include implementation("net.legacy.legacies:locator_lodestones-1.5.2+1.21.9+A")
    include implementation("net.legacy.legacies:personalplayer-1.21.11-1.4.5")
    include implementation("net.legacy.legacies:preferred-gamerules-2.0.0+1.21.11")
    include implementation("net.legacy.legacies:shifting-wares-3.2.1+1.21.11")
